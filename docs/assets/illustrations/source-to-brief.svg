<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:800px;margin:24px auto;display:block;font-family:'Google Sans',sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="a" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#d1d5db"/></marker>
  </defs>
  <rect width="800" height="200" rx="16" fill="#f8f9fa" stroke="#e8eaed"/>

  <!-- 5 cards x=60,200,340,480,620  w=120  h=160  centers=120,260,400,540,680 -->

  <!-- Card 1 — NASA FIRMS -->
  <rect x="60" y="20" width="120" height="160" rx="10" fill="#fff" filter="url(#s)"/>
  <image href="../logos/nasa.svg" x="100" y="36" width="40" height="40"/>
  <text x="120" y="96" text-anchor="middle" fill="#1f1f1f" font-size="12" font-weight="500">FIRMS</text>
  <text x="120" y="113" text-anchor="middle" fill="#5F6368" font-size="10">Provides satellite hotspot</text>
  <text x="120" y="128" text-anchor="middle" fill="#5F6368" font-size="10">detection data.</text>

  <!-- Card 2 — Google Cloud -->
  <rect x="200" y="20" width="120" height="160" rx="10" fill="#fff" filter="url(#s)"/>
  <image href="../logos/googlecloud.svg" x="240" y="36" width="40" height="40"/>
  <text x="260" y="96" text-anchor="middle" fill="#1f1f1f" font-size="12" font-weight="500">Google Cloud</text>
  <text x="260" y="113" text-anchor="middle" fill="#5F6368" font-size="10">Ingests and streams</text>
  <text x="260" y="128" text-anchor="middle" fill="#5F6368" font-size="10">events to the UI.</text>

  <!-- Card 3 — Elasticsearch MCP -->
  <rect x="340" y="20" width="120" height="160" rx="10" fill="#fff" filter="url(#s)"/>
  <image href="../logos/elastic.svg" x="372" y="36" width="40" height="40"/>
  <text x="400" y="96" text-anchor="middle" fill="#1f1f1f" font-size="12" font-weight="500">Elasticsearch MCP</text>
  <text x="400" y="113" text-anchor="middle" fill="#5F6368" font-size="10">Stores and queries zones,</text>
  <text x="400" y="128" text-anchor="middle" fill="#5F6368" font-size="10">shelters, and road events.</text>

  <!-- Card 4 — Gemini -->
  <rect x="480" y="20" width="120" height="160" rx="10" fill="#fff" filter="url(#s)"/>
  <image href="../logos/gemini.svg" x="520" y="36" width="40" height="40"/>
  <text x="540" y="96" text-anchor="middle" fill="#1f1f1f" font-size="12" font-weight="500">Gemini</text>
  <text x="540" y="113" text-anchor="middle" fill="#5F6368" font-size="10">Runs the fireguard</text>
  <text x="540" y="128" text-anchor="middle" fill="#5F6368" font-size="10">evacuation workflow.</text>

  <!-- Card 5 — Mapbox -->
  <rect x="620" y="20" width="120" height="160" rx="10" fill="#fff" filter="url(#s)"/>
  <image href="../logos/mapbox.svg" x="660" y="36" width="40" height="40"/>
  <text x="680" y="96" text-anchor="middle" fill="#1f1f1f" font-size="12" font-weight="500">Mapbox</text>
  <text x="680" y="113" text-anchor="middle" fill="#5F6368" font-size="10">Renders the route and</text>
  <text x="680" y="128" text-anchor="middle" fill="#5F6368" font-size="10">shelter map for operators.</text>

  <!-- Arrows at y=100 -->
  <line x1="182" y1="100" x2="198" y2="100" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="322" y1="100" x2="338" y2="100" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="462" y1="100" x2="478" y2="100" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="602" y1="100" x2="618" y2="100" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
