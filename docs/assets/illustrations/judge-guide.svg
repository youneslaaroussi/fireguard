<svg viewBox="0 0 880 230" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:880px;margin:24px auto;display:block;font-family:'Google Sans',sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="880" height="230" rx="16" fill="#f8f9fa" stroke="#e8eaed"/>

  <!-- Card 1 — Detect -->
  <rect x="20" y="20" width="268" height="190" rx="12" fill="#fff" filter="url(#s)"/>
  <image href="../logos/nasa.svg" x="130" y="40" width="48" height="48"/>
  <text x="154" y="112" text-anchor="middle" fill="#EA4335" font-size="10" font-weight="700" letter-spacing="1.4">DETECT</text>
  <text x="154" y="133" text-anchor="middle" fill="#1f1f1f" font-size="15" font-weight="500">Satellite signal</text>
  <text x="154" y="156" text-anchor="middle" fill="#5F6368" font-size="12">A NASA FIRMS hotspot triggers</text>
  <text x="154" y="173" text-anchor="middle" fill="#5F6368" font-size="12">the evacuation workflow.</text>

  <!-- Card 2 — Analyse -->
  <rect x="306" y="20" width="268" height="190" rx="12" fill="#fff" filter="url(#s)"/>
  <image href="../logos/elastic.svg" x="416" y="40" width="48" height="48"/>
  <text x="440" y="112" text-anchor="middle" fill="#4285F4" font-size="10" font-weight="700" letter-spacing="1.4">ANALYSE</text>
  <text x="440" y="133" text-anchor="middle" fill="#1f1f1f" font-size="15" font-weight="500">Geospatial evidence</text>
  <text x="440" y="156" text-anchor="middle" fill="#5F6368" font-size="12">The agent queries zones, shelters,</text>
  <text x="440" y="173" text-anchor="middle" fill="#5F6368" font-size="12">and roads from Elasticsearch MCP.</text>

  <!-- Card 3 — Act -->
  <rect x="592" y="20" width="268" height="190" rx="12" fill="#fff" filter="url(#s)"/>
  <image href="../logos/gemini.svg" x="702" y="40" width="48" height="48"/>
  <text x="726" y="112" text-anchor="middle" fill="#34A853" font-size="10" font-weight="700" letter-spacing="1.4">ACT</text>
  <text x="726" y="133" text-anchor="middle" fill="#1f1f1f" font-size="15" font-weight="500">Evacuation decision</text>
  <text x="726" y="156" text-anchor="middle" fill="#5F6368" font-size="12">The agent returns a recommended</text>
  <text x="726" y="173" text-anchor="middle" fill="#5F6368" font-size="12">route and map annotations.</text>
</svg>
