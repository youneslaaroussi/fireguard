<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">FireGuard evacuation decision loop</title>
  <desc id="desc">A six-step decision loop from threat payload to route, shelter, and map output.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#7f90a3"/>
    </marker>
    <style>
      .bg{fill:#f7fafc}
      .ring{fill:#ffffff;stroke:#d9e4ec;stroke-width:2}
      .node{fill:#111a23;stroke:#2d3e50;stroke-width:1.5}
      .title{font:700 30px Arial, sans-serif;fill:#111a23}
      .subtitle{font:400 15px Arial, sans-serif;fill:#536274}
      .nodeTitle{font:700 16px Arial, sans-serif;fill:#ffffff}
      .nodeText{font:400 12px Arial, sans-serif;fill:#b9c8d6}
      .num{font:700 20px Arial, sans-serif;fill:#ffffff}
      .arrow{stroke:#7f90a3;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .small{font:700 12px Arial, sans-serif;fill:#334155;letter-spacing:1px}
    </style>
  </defs>

  <rect class="bg" width="1200" height="620" rx="22"/>
  <text class="title" x="60" y="58">Evacuation workflow: from signal to action</text>
  <text class="subtitle" x="60" y="84">The agent is constrained to operational checks that judges can inspect in the workflow trace.</text>

  <circle class="ring" cx="600" cy="330" r="146"/>
  <circle cx="600" cy="330" r="80" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <image href="../logos/gemini.svg" x="558" y="286" width="84" height="84"/>
  <text class="small" x="600" y="396" text-anchor="middle">FIREGUARD AGENT</text>

  <g transform="translate(92 184)">
    <rect class="node" width="214" height="98" rx="16"/>
    <circle cx="34" cy="34" r="17" fill="#e03c31"/>
    <text class="num" x="34" y="41" text-anchor="middle">1</text>
    <text class="nodeTitle" x="64" y="31">Threat payload</text>
    <text class="nodeText" x="64" y="53">hotspot, FRP, source</text>
    <text class="nodeText" x="64" y="72">zone name + centroid</text>
  </g>
  <g transform="translate(342 92)">
    <rect class="node" width="214" height="98" rx="16"/>
    <circle cx="34" cy="34" r="17" fill="#4285f4"/>
    <text class="num" x="34" y="41" text-anchor="middle">2</text>
    <text class="nodeTitle" x="64" y="31">Zone priority</text>
    <text class="nodeText" x="64" y="53">fireguard_search_zones</text>
    <text class="nodeText" x="64" y="72">population + homes</text>
  </g>
  <g transform="translate(644 92)">
    <rect class="node" width="214" height="98" rx="16"/>
    <circle cx="34" cy="34" r="17" fill="#00a88f"/>
    <text class="num" x="34" y="41" text-anchor="middle">3</text>
    <text class="nodeTitle" x="64" y="31">Shelter scan</text>
    <text class="nodeText" x="64" y="53">fireguard_search_shelters</text>
    <text class="nodeText" x="64" y="72">OPEN/CLOSED status</text>
  </g>
  <g transform="translate(894 184)">
    <rect class="node" width="214" height="98" rx="16"/>
    <circle cx="34" cy="34" r="17" fill="#f59e0b"/>
    <text class="num" x="34" y="41" text-anchor="middle">4</text>
    <text class="nodeTitle" x="64" y="31">Road events</text>
    <text class="nodeText" x="64" y="50">fireguard_search</text>
    <text class="nodeText" x="64" y="68">road_events</text>
    <text class="nodeText" x="64" y="86">closures and caveats</text>
  </g>
  <g transform="translate(644 470)">
    <rect class="node" width="214" height="98" rx="16"/>
    <circle cx="34" cy="34" r="17" fill="#8e75b2"/>
    <text class="num" x="34" y="41" text-anchor="middle">5</text>
    <text class="nodeTitle" x="64" y="31">Route checks</text>
    <text class="nodeText" x="64" y="53">fireguard_evaluate_route</text>
    <text class="nodeText" x="64" y="72">primary + what-if</text>
  </g>
  <g transform="translate(342 470)">
    <rect class="node" width="214" height="98" rx="16"/>
    <circle cx="34" cy="34" r="17" fill="#0ea5e9"/>
    <text class="num" x="34" y="41" text-anchor="middle">6</text>
    <text class="nodeTitle" x="64" y="31">Brief + map</text>
    <text class="nodeText" x="64" y="53">fireguard_map_annotation</text>
    <text class="nodeText" x="64" y="72">complete_workflow_node</text>
  </g>

  <path class="arrow" d="M306 224 C360 160 360 150 342 142"/>
  <path class="arrow" d="M556 142 H644"/>
  <path class="arrow" d="M858 142 C902 154 915 170 894 206"/>
  <path class="arrow" d="M1002 282 C1016 398 922 500 858 516"/>
  <path class="arrow" d="M644 520 H556"/>
  <path class="arrow" d="M342 520 C246 490 220 370 244 282"/>
</svg>
