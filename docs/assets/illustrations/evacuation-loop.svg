<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:800px;margin:24px auto;display:block;font-family:'Google Sans',sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="a" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#d1d5db"/></marker>
  </defs>
  <rect width="800" height="200" rx="16" fill="#f8f9fa" stroke="#e8eaed"/>

  <!-- 4 cards x=50,230,410,590  w=160  h=160  centers=130,310,490,670 -->

  <!-- Card 1 — FIRMS trigger -->
  <rect x="50" y="20" width="160" height="160" rx="10" fill="#fff" filter="url(#s)"/>
  <image href="../logos/nasa.svg" x="108" y="34" width="44" height="44"/>
  <text x="130" y="100" text-anchor="middle" fill="#EA4335" font-size="10" font-weight="700" letter-spacing="1.2">TRIGGER</text>
  <text x="130" y="118" text-anchor="middle" fill="#1f1f1f" font-size="12" font-weight="500">FIRMS hotspot</text>
  <text x="130" y="135" text-anchor="middle" fill="#5F6368" font-size="10">A satellite hotspot is detected</text>
  <text x="130" y="150" text-anchor="middle" fill="#5F6368" font-size="10">near an evacuation zone.</text>

  <!-- Card 2 — Gemini agent -->
  <rect x="230" y="20" width="160" height="160" rx="10" fill="#fff" filter="url(#s)"/>
  <image href="../logos/gemini.svg" x="288" y="34" width="44" height="44"/>
  <text x="310" y="100" text-anchor="middle" fill="#4285F4" font-size="10" font-weight="700" letter-spacing="1.2">REASON</text>
  <text x="310" y="118" text-anchor="middle" fill="#1f1f1f" font-size="12" font-weight="500">Gemini agent</text>
  <text x="310" y="135" text-anchor="middle" fill="#5F6368" font-size="10">The agent runs the fireguard</text>
  <text x="310" y="150" text-anchor="middle" fill="#5F6368" font-size="10">evacuation workflow.</text>

  <!-- Card 3 — Elasticsearch MCP -->
  <rect x="410" y="20" width="160" height="160" rx="10" fill="#fff" filter="url(#s)"/>
  <image href="../logos/elastic.svg" x="468" y="34" width="44" height="44"/>
  <text x="490" y="100" text-anchor="middle" fill="#FBBC05" font-size="10" font-weight="700" letter-spacing="1.2">QUERY</text>
  <text x="490" y="118" text-anchor="middle" fill="#1f1f1f" font-size="12" font-weight="500">Elasticsearch MCP</text>
  <text x="490" y="135" text-anchor="middle" fill="#5F6368" font-size="10">The agent queries zones,</text>
  <text x="490" y="150" text-anchor="middle" fill="#5F6368" font-size="10">shelters, and safe routes.</text>

  <!-- Card 4 — Mapbox output -->
  <rect x="590" y="20" width="160" height="160" rx="10" fill="#fff" filter="url(#s)"/>
  <image href="../logos/mapbox.svg" x="648" y="34" width="44" height="44"/>
  <text x="670" y="100" text-anchor="middle" fill="#34A853" font-size="10" font-weight="700" letter-spacing="1.2">OUTPUT</text>
  <text x="670" y="118" text-anchor="middle" fill="#1f1f1f" font-size="12" font-weight="500">Operator map</text>
  <text x="670" y="135" text-anchor="middle" fill="#5F6368" font-size="10">Returns an evacuation brief</text>
  <text x="670" y="150" text-anchor="middle" fill="#5F6368" font-size="10">with map annotations.</text>

  <!-- Arrows at y=100 -->
  <line x1="212" y1="100" x2="228" y2="100" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="392" y1="100" x2="408" y2="100" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="572" y1="100" x2="588" y2="100" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
